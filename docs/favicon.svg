<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="0.4" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4f0e"/>
      <stop offset="50%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#4a3508"/>
    </linearGradient>
    <radialGradient id="turretGrad" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="0.6" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
    <linearGradient id="barrelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4f0e"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角背景 -->
  <rect width="64" height="64" rx="12" fill="#1a1a1a"/>

  <!-- 左侧履带 -->
  <rect x="10" y="14" width="11" height="36" rx="2" fill="url(#trackGrad)"/>
  <g fill="#3a2a06">
    <rect x="12" y="17" width="7" height="3" rx="1"/>
    <rect x="12" y="23" width="7" height="3" rx="1"/>
    <rect x="12" y="29" width="7" height="3" rx="1"/>
    <rect x="12" y="35" width="7" height="3" rx="1"/>
    <rect x="12" y="41" width="7" height="3" rx="1"/>
    <rect x="12" y="47" width="7" height="3" rx="1"/>
  </g>

  <!-- 右侧履带 -->
  <rect x="43" y="14" width="11" height="36" rx="2" fill="url(#trackGrad)"/>
  <g fill="#3a2a06">
    <rect x="45" y="17" width="7" height="3" rx="1"/>
    <rect x="45" y="23" width="7" height="3" rx="1"/>
    <rect x="45" y="29" width="7" height="3" rx="1"/>
    <rect x="45" y="35" width="7" height="3" rx="1"/>
    <rect x="45" y="41" width="7" height="3" rx="1"/>
    <rect x="45" y="47" width="7" height="3" rx="1"/>
  </g>

  <!-- 车身 -->
  <rect x="19" y="18" width="26" height="28" rx="2" fill="url(#bodyGrad)"/>
  <!-- 车身上边缘高光 -->
  <rect x="20" y="19" width="24" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
  <!-- 车身左边缘高光 -->
  <rect x="20" y="19" width="2" height="26" rx="1" fill="rgba(255,255,255,0.15)"/>
  <!-- 车身下边缘阴影 -->
  <rect x="20" y="43" width="24" height="3" rx="1" fill="rgba(0,0,0,0.25)"/>
  <!-- 车身右边缘阴影 -->
  <rect x="42" y="19" width="2" height="26" rx="1" fill="rgba(0,0,0,0.2)"/>

  <!-- 炮塔（圆形） -->
  <circle cx="32" cy="32" r="9" fill="url(#turretGrad)"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#6b4f0e" stroke-width="1"/>

  <!-- 炮管（向上） -->
  <rect x="29.5" y="8" width="5" height="22" rx="1" fill="url(#barrelGrad)"/>
  <!-- 炮管前端加粗 -->
  <rect x="28.5" y="7" width="7" height="4" rx="1" fill="#b8860b"/>
  <!-- 炮管根部 -->
  <rect x="28.5" y="28" width="7" height="4" rx="1" fill="#6b4f0e"/>

  <!-- 舱盖 -->
  <circle cx="32" cy="32" r="3.5" fill="#6b4f0e"/>
  <circle cx="32" cy="32" r="2" fill="#4a3508"/>
  <circle cx="31" cy="31" r="0.8" fill="rgba(255,255,255,0.3)"/>
</svg>
